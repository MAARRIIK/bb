services:
  ai:
    image: ai-server:local
    build:
      context: ../../packages/bb-app/release-server
      dockerfile: ../../../deploy/ai-server/Dockerfile
    environment:
      BB_OWNER_AUTH: "true"
      BB_TELEMETRY: "false"
      BB_APP_URL: https://${AI_DOMAIN:?Set AI_DOMAIN in .env}
      BB_EXTERNAL_URL: https://${AI_DOMAIN:?Set AI_DOMAIN in .env}
    ports:
      - "127.0.0.1:${AI_HTTP_PORT:-39890}:38886"
    volumes:
      - ai-data:/data
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:38886/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2
    profiles: [https]
    environment:
      AI_DOMAIN: ${AI_DOMAIN:?Set AI_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - ai
    restart: unless-stopped

volumes:
  ai-data:
  caddy-data:
  caddy-config:
